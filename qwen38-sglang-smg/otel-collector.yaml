receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  filter/probes:
    error_mode: ignore
    traces:
      span:
        - 'attributes["uri"] == "/readiness"'
        - 'attributes["uri"] == "/health"'
        - 'attributes["uri"] == "/metrics"'
  transform/metadata_only:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'keep_keys(attributes, ["method", "uri", "status_code", "latency", "request_id", "request.id", "rid", "module", "model", "mode", "request_type", "rpc.system", "http.request.method", "http.response.status_code", "http.route", "http.method", "http.status_code", "gen_ai.operation.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "error.type", "tp_rank", "dp_rank", "pp_rank", "thread_label", "host_id", "pid", "probe.mode"])'
      - context: spanevent
        statements:
          - 'keep_keys(attributes, ["error.type", "exception.type"])'
  resource:
    attributes:
      - key: deployment.environment.name
        value: ${env:TELEMETRY_ENVIRONMENT}
        action: upsert
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  otlp_grpc:
    endpoint: ${env:OTLP_UPSTREAM_ENDPOINT}
    headers:
      authorization: ${env:OTLP_UPSTREAM_AUTHORIZATION}
    tls:
      insecure: ${env:OTLP_UPSTREAM_INSECURE}
    sending_queue:
      queue_size: 256
    retry_on_failure:
      max_elapsed_time: 60s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/probes, transform/metadata_only, resource, batch]
      exporters: [otlp_grpc]
