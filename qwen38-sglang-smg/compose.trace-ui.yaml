# Local, transient viewer. Use together with compose.tracing.yaml.
services:
  otel-collector:
    environment:
      OTLP_UPSTREAM_ENDPOINT: jaeger:4317
      OTLP_UPSTREAM_INSECURE: "true"
      OTLP_UPSTREAM_AUTHORIZATION: ""
  jaeger:
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    init: true
    restart: ${RESTART_POLICY:-unless-stopped}
    mem_limit: 512m
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
    command: >-
      --config=/etc/jaeger/config.yaml
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
