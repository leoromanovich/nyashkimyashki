name: glm-5.1-nvfp4-hicache
services:
  sglang:
    platform: linux/amd64
    image: local/glm-5.1-nvfp4-hicache:tracing
    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: 1m
    ipc: host
    shm_size: 32gb
    cap_add:
    - SYS_NICE
    ports:
    - 127.0.0.1:${ENGINE_PORT:-30001}:30000
    environment:
      TRITON_CACHE_DIR: /cache/triton
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      SGLANG_DG_CACHE_DIR: /cache/dg
      OMP_NUM_THREADS: '32'
      SGLANG_ENABLE_SPEC_V2: '1'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_SERVICE_NAME: sglang
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_BSP_MAX_QUEUE_SIZE: '2048'
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
      OTEL_BSP_SCHEDULE_DELAY: '1000'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      SGLANG_TRACE_LEVEL: ${SGLANG_TRACE_LEVEL:-1}
    volumes:
    - /opt/models:/models
    - ./logs:/logs
    - ./cache/torchinductor:/cache/torchinductor
    - ./cache/triton:/cache/triton
    - ./cache/dg:/cache/dg
    - ./cache/filecache:/tmp/hicache
    ulimits:
      memlock: -1
      stack: 67108864
    command: >-
      python -m sglang.launch_server
      --model-path /models/GLM-5.1-NVFP4
      --quantization modelopt_fp4
      --served-model-name glm
      --host 0.0.0.0
      --port 30000
      --admin-api-key '${SGLANG_ADMIN_API_KEY:?set SGLANG_ADMIN_API_KEY}'
      --attention-backend nsa
      --nsa-prefill-backend trtllm
      --nsa-decode-backend trtllm
      --moe-runner-backend flashinfer_trtllm
      --enable-flashinfer-allreduce-fusion
      --context-length 202752
      --reasoning-parser glm45
      --tool-call-parser glm47
      --trust-remote-code
      --kv-cache-dtype fp8_e4m3
      --enable-hierarchical-cache
      --hicache-io-backend kernel
      --hicache-size 150
      --hicache-write-policy write_through_selective
      --page-size 64
      --chunked-prefill-size 65536
      --max-prefill-tokens 32768
      --schedule-conservativeness 3.3333333333
      --cuda-graph-max-bs 18
      --max-running-requests 128
      --tp 8
      --dp 8
      --enable-dp-attention
      --enable-flashinfer-allreduce-fusion
      --enable-dp-lm-head
      --load-balance-method total_tokens
      --schedule-policy lpm
      --mem-fraction-static 0.85
      --enable-metrics
      --enable-custom-logit-processor
      --speculative-algorithm EAGLE
      --speculative-num-steps 3
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 4
      --json-model-override-args '{"index_topk_pattern": "FFSFSSSFSSFFFSSSFFFSFSSSSSSFFSFFSFFSSFFFFFFSFFFFFSFFSSSSSSFSFFFSFSSSFSFFSFFSSS"}'
      --model-loader-extra-config '{"enable_multithread_load":true,"num_threads":128}'
      --enable-trace
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --otlp-traces-endpoint otel-collector:4317
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:30000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '5'
    build:
      context: ../../misc/telemetry
      dockerfile: Dockerfile.sglang
      args:
        SGLANG_BASE_IMAGE: lmsysorg/sglang:v0.5.12.post1-cu130
    depends_on:
      otel-collector:
        condition: service_started
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30000
      --worker-urls 'http://${SMG_WORKER_SERVICE:-sglang}:30000'
      --backend sglang
      --dp-aware
      --policy cache_aware
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 29000
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    depends_on:
      otel-collector:
        condition: service_started
    ports:
    - ${SMG_BIND:-127.0.0.1}:${SMG_PORT:-30000}:30000
    - 127.0.0.1:${SMG_METRICS_PORT:-29000}:29000
    restart: ${RESTART_POLICY:-unless-stopped}
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: ${OTLP_UPSTREAM_ENDPOINT:?set external OTLP gRPC endpoint}
      OTLP_UPSTREAM_INSECURE: ${OTLP_UPSTREAM_INSECURE:-false}
      TELEMETRY_RECIPE: glm-5.1-nvfp4-hicache
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-production}
    restart: ${RESTART_POLICY:-unless-stopped}
