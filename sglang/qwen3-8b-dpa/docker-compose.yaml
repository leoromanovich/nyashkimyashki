name: qwen3-8b-dpa
services:
  sglang:
    platform: linux/amd64
    image: local/qwen3-8b-dpa:tracing
    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: 1m
    ipc: host
    shm_size: 32gb
    cap_add:
    - SYS_NICE
    ports:
    - 127.0.0.1:${ENGINE_PORT:-30001}:30000
    environment:
      TRITON_CACHE_DIR: /cache/triton
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      SGLANG_DG_CACHE_DIR: /cache/dg
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-32}
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_SERVICE_NAME: sglang
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_BSP_MAX_QUEUE_SIZE: '2048'
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
      OTEL_BSP_SCHEDULE_DELAY: '1000'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      SGLANG_TRACE_LEVEL: ${SGLANG_TRACE_LEVEL:-1}
    volumes:
    - /mnt/disk1/models:/models
    - ./logs:/logs
    - ./cache/torchinductor:/cache/torchinductor
    - ./cache/triton:/cache/triton
    - ./cache/dg:/cache/dg
    ulimits:
      memlock: -1
      stack: 67108864
    entrypoint:
    - python3
    - -m
    - sglang.launch_server
    command: >-
      --model-path=/models/Qwen/Qwen3-8B-FP8
      --served-model-name=qwen3-8b
      --host=0.0.0.0
      --port=30000
      --trust-remote-code
      --context-length=32768
      --reasoning-parser=qwen3
      --kv-cache-dtype=fp8_e4m3
      --page-size=64
      --chunked-prefill-size=8192
      --max-prefill-tokens=8192
      --schedule-conservativeness=3.3333333333
      --cuda-graph-max-bs=8
      --max-running-requests=32
      --tp=2
      --dp=2
      --enable-dp-attention
      --enable-dp-lm-head
      --load-balance-method=total_tokens
      --schedule-policy=lpm
      --mem-fraction-static=0.80
      --enable-metrics
      --enable-cache-report
      '--model-loader-extra-config={"enable_multithread_load":true,"num_threads":128}'
      --enable-trace
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --otlp-traces-endpoint otel-collector:4317
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:30000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 900s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '5'
    build:
      context: ../../misc/telemetry
      dockerfile: Dockerfile.sglang
      args:
        SGLANG_BASE_IMAGE: ${SGLANG_IMAGE:-lmsysorg/sglang:v0.5.12-cu130}
    depends_on:
      otel-collector:
        condition: service_started
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30000
      --worker-urls 'http://${SMG_WORKER_SERVICE:-sglang}:30000'
      --backend sglang
      --dp-aware
      --policy cache_aware
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 29000
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    depends_on:
      otel-collector:
        condition: service_started
    ports:
    - ${SMG_BIND:-127.0.0.1}:${SMG_PORT:-30000}:30000
    - 127.0.0.1:${SMG_METRICS_PORT:-29000}:29000
    restart: ${RESTART_POLICY:-unless-stopped}
  jaeger:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: jaeger
    restart: ${RESTART_POLICY:-unless-stopped}
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: ${OTLP_UPSTREAM_ENDPOINT:-jaeger:4317}
      OTLP_UPSTREAM_INSECURE: ${OTLP_UPSTREAM_INSECURE:-true}
      TELEMETRY_RECIPE: qwen3-8b-dpa
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-development}
    ports:
    - 127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317
    - 127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318
    restart: ${RESTART_POLICY:-unless-stopped}
