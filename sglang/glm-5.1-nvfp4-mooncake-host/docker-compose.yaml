name: glm-5.1-nvfp4-mooncake-host
services:
  mooncake_master:
    image: lmsysorg/sglang:dev-cu13
    network_mode: host
    ipc: host
    shm_size: 32g
    ulimits:
      memlock: -1
    command: >-
      mooncake_master
      --rpc_port=50051
      --metrics_port=9003
      --enable_http_metadata_server=true
      --http_metadata_server_port=8080
      --eviction_high_watermark_ratio=0.95
      --logtostderr=true
    restart: ${RESTART_POLICY:-unless-stopped}
    environment: {}
  sglang:
    platform: linux/amd64
    image: local/glm-5.1-nvfp4-mooncake-host:tracing
    depends_on:
      mooncake_master:
        condition: service_started
      otel-collector:
        condition: service_started
    network_mode: host
    ipc: host
    shm_size: 128g
    ulimits:
      memlock: -1
    gpus: all
    environment:
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      PYTHONUNBUFFERED: '1'
      MC_STORE_MEMCPY: '1'
      MOONCAKE_OFFLOAD_GB: '7000'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_SERVICE_NAME: sglang
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_BSP_MAX_QUEUE_SIZE: '2048'
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
      OTEL_BSP_SCHEDULE_DELAY: '1000'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      SGLANG_TRACE_LEVEL: ${SGLANG_TRACE_LEVEL:-1}
      OTLP_TRACES_ENDPOINT: 127.0.0.1:${COLLECTOR_GRPC_PORT:-14317}
      SGLANG_API_KEY: ${SGLANG_API_KEY:?set SGLANG_API_KEY}
      SGLANG_ADMIN_API_KEY: ${SGLANG_ADMIN_API_KEY:?set SGLANG_ADMIN_API_KEY}
      ENGINE_PORT: ${ENGINE_PORT:-30001}
    volumes:
    - /home/moncacke_cache:/mooncake_cache
    - /home/huggingface-cache:/root/.cache/huggingface
    - ./sglang-entrypoint.sh:/opt/recipe/sglang-entrypoint.sh:ro
    restart: ${RESTART_POLICY:-unless-stopped}
    entrypoint:
    - bash
    - /opt/recipe/sglang-entrypoint.sh
    build:
      context: ../../misc/telemetry
      dockerfile: Dockerfile.sglang
      args:
        SGLANG_BASE_IMAGE: lmsysorg/sglang:dev-cu13
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['ENGINE_PORT']+'/health',timeout=10)
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host '${SMG_BIND:-127.0.0.1}'
      --port '${SMG_PORT:-30000}'
      --worker-urls 'http://127.0.0.1:${ENGINE_PORT:-30001}'
      --backend sglang
      --policy cache_aware
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint '127.0.0.1:${COLLECTOR_GRPC_PORT:-14317}'
      --prometheus-host 127.0.0.1
      --prometheus-port '${SMG_METRICS_PORT:-29000}'
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    depends_on:
      otel-collector:
        condition: service_started
    network_mode: host
    environment:
      SMG_PORT: ${SMG_PORT:-30000}
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['SMG_PORT']+'/readiness',timeout=5)
    restart: ${RESTART_POLICY:-unless-stopped}
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: ${OTLP_UPSTREAM_ENDPOINT:?set external OTLP gRPC endpoint}
      OTLP_UPSTREAM_INSECURE: ${OTLP_UPSTREAM_INSECURE:-false}
      TELEMETRY_RECIPE: glm-5.1-nvfp4-mooncake-host
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-production}
      OTLP_RECEIVER_HOST: 127.0.0.1
      OTLP_RECEIVER_GRPC_PORT: ${COLLECTOR_GRPC_PORT:-14317}
      OTLP_RECEIVER_HTTP_PORT: ${COLLECTOR_HTTP_PORT:-14318}
    network_mode: host
    restart: ${RESTART_POLICY:-unless-stopped}
