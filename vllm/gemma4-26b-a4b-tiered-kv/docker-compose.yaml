name: gemma4-a4b-vllm
x-gemma-common:
  image: ${VLLM_IMAGE:?set VLLM_IMAGE}
  restart: unless-stopped
  init: true
  ipc: private
  shm_size: ${VLLM_SHM_GIB:-144}gb
  stop_grace_period: 120s
  entrypoint: &id001
  - /opt/gemma4/serve.sh
  ports:
  - ${VLLM_BIND_IP:-127.0.0.1}:${VLLM_PORT:-8000}:8000
  environment: &id002
    HF_HUB_DISABLE_TELEMETRY: '1'
    HF_HUB_OFFLINE: '1'
    NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:-0}
    OPENAI_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
    PYTHONHASHSEED: '0'
    TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
    TRANSFORMERS_OFFLINE: '1'
    VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
    VLLM_CACHE_ROOT: /cache/vllm
    VLLM_ENABLE_CUDA_COMPATIBILITY: ${VLLM_ENABLE_CUDA_COMPATIBILITY:-1}
    VLLM_USE_V2_MODEL_RUNNER: '1'
    VLLM_SERVED_MODEL: ${VLLM_SERVED_MODEL:-gemma4-26b-a4b}
    OTEL_TRACES_SAMPLER: parentbased_always_on
    OTEL_SERVICE_NAME: vllm
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
    OTEL_BSP_MAX_QUEUE_SIZE: '2048'
    OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
    OTEL_BSP_SCHEDULE_DELAY: '1000'
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  ulimits: &id003
    memlock:
      soft: -1
      hard: -1
  deploy: &id004
    resources:
      reservations:
        devices:
        - driver: nvidia
          count: 1
          capabilities:
          - gpu
  healthcheck: &id005
    test:
    - CMD
    - python3
    - -c
    - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/v1/models',headers={'Authorization':'Bearer '+os.environ['VLLM_API_KEY']}); urllib.request.urlopen(r,timeout=5).read()
    interval: 30s
    timeout: 10s
    retries: 20
    start_period: 30m
services:
  gemma4:
    image: ${VLLM_IMAGE:?set VLLM_IMAGE}
    restart: ${RESTART_POLICY:-unless-stopped}
    init: true
    ipc: private
    shm_size: ${VLLM_SHM_GIB:-144}gb
    stop_grace_period: 120s
    entrypoint: *id001
    ports:
    - ${VLLM_BIND_IP:-127.0.0.1}:${VLLM_PORT:-8000}:8000
    environment: *id002
    ulimits: *id003
    deploy: *id004
    healthcheck: *id005
    container_name: gemma4-a4b-vllm
    volumes:
    - ${MODEL_DIR:?set MODEL_DIR}:/models:ro
    - ${VLLM_CACHE_DIR:?set VLLM_CACHE_DIR}:/cache
    - ${KV_CACHE_DIR:?set KV_CACHE_DIR}:/kv-cache
    - ${BENCH_RESULTS_DIR:-./results}:/bench-results
    - ./bench-serve-matrix.sh:/opt/gemma4/bench-serve-matrix.sh:ro
    - ./serve.sh:/opt/gemma4/serve.sh:ro
    - ./summarize-bench.py:/opt/gemma4/summarize-bench.py:ro
    command: >-
      --model /models
      --served-model-name '${VLLM_SERVED_MODEL:-gemma4-26b-a4b}'
      --host 0.0.0.0
      --port 8000
      --dtype bfloat16
      --tensor-parallel-size 1
      --attention-backend TRITON_ATTN
      --max-model-len '${MAX_MODEL_LEN:-131072}'
      --max-num-seqs '${MAX_NUM_SEQS:-24}'
      --max-num-batched-tokens '${MAX_NUM_BATCHED_TOKENS:-8192}'
      --gpu-memory-utilization '${GPU_MEMORY_UTILIZATION:-0.90}'
      --async-scheduling
      --enable-prefix-caching
      --enable-chunked-prefill
      --kv-offloading-size '${KV_CPU_GIB:?set' 'KV_CPU_GIB}'
      --kv-offloading-backend native
      --kv-transfer-config '${KV_TRANSFER_CONFIG:?set KV_TRANSFER_CONFIG}'
      --mm-processor-kwargs '{"max_soft_tokens":${MM_MAX_SOFT_TOKENS:-1120}}'
      --limit-mm-per-prompt '{"image":${MAX_IMAGES_PER_PROMPT:-4},"video":0,"audio":0}'
      --mm-processor-cache-gb '${MM_PROCESSOR_CACHE_GB:-4}'
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --chat-template /models/chat_template.jinja
      --reasoning-parser gemma4
      --default-chat-template-kwargs '{"enable_thinking":false}'
      --generation-config vllm
      --enable-prompt-tokens-details
      --enable-request-id-headers
      --disable-log-requests
      --otlp-traces-endpoint otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started
  gemma4-mtp:
    image: ${VLLM_IMAGE:?set VLLM_IMAGE}
    restart: ${RESTART_POLICY:-unless-stopped}
    init: true
    ipc: private
    shm_size: ${VLLM_SHM_GIB:-144}gb
    stop_grace_period: 120s
    entrypoint: *id001
    ports:
    - ${VLLM_BIND_IP:-127.0.0.1}:${VLLM_PORT:-8000}:8000
    environment: *id002
    ulimits: *id003
    deploy: *id004
    healthcheck: *id005
    profiles:
    - mtp
    container_name: gemma4-a4b-vllm-mtp
    volumes:
    - ${MODEL_DIR:?set MODEL_DIR}:/models:ro
    - ${ASSISTANT_MODEL_DIR:?set ASSISTANT_MODEL_DIR}:/assistant-model:ro
    - ${VLLM_CACHE_DIR:?set VLLM_CACHE_DIR}:/cache
    - ${KV_CACHE_DIR:?set KV_CACHE_DIR}:/kv-cache
    - ${BENCH_RESULTS_DIR:-./results}:/bench-results
    - ./bench-serve-matrix.sh:/opt/gemma4/bench-serve-matrix.sh:ro
    - ./serve.sh:/opt/gemma4/serve.sh:ro
    - ./summarize-bench.py:/opt/gemma4/summarize-bench.py:ro
    command: >-
      --model /models
      --served-model-name '${VLLM_SERVED_MODEL:-gemma4-26b-a4b}'
      --host 0.0.0.0
      --port 8000
      --dtype bfloat16
      --tensor-parallel-size 1
      --attention-backend TRITON_ATTN
      --max-model-len '${MAX_MODEL_LEN:-131072}'
      --max-num-seqs '${MAX_NUM_SEQS:-24}'
      --max-num-batched-tokens '${MAX_NUM_BATCHED_TOKENS:-8192}'
      --gpu-memory-utilization '${GPU_MEMORY_UTILIZATION:-0.90}'
      --async-scheduling
      --enable-prefix-caching
      --enable-chunked-prefill
      --kv-offloading-size '${KV_CPU_GIB:?set' 'KV_CPU_GIB}'
      --kv-offloading-backend native
      --kv-transfer-config '${KV_TRANSFER_CONFIG:?set KV_TRANSFER_CONFIG}'
      --mm-processor-kwargs '{"max_soft_tokens":${MM_MAX_SOFT_TOKENS:-1120}}'
      --limit-mm-per-prompt '{"image":${MAX_IMAGES_PER_PROMPT:-4},"video":0,"audio":0}'
      --mm-processor-cache-gb '${MM_PROCESSOR_CACHE_GB:-4}'
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --chat-template /models/chat_template.jinja
      --reasoning-parser gemma4
      --default-chat-template-kwargs '{"enable_thinking":false}'
      --generation-config vllm
      --enable-prompt-tokens-details
      --enable-request-id-headers
      --speculative-config '{"method":"mtp","model":"/assistant-model","num_speculative_tokens":${MTP_NUM_SPECULATIVE_TOKENS:-4}}'
      --disable-log-requests
      --otlp-traces-endpoint otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30000
      --worker-urls 'http://${SMG_WORKER_SERVICE:-gemma4}:8000'
      --backend vllm
      --policy cache_aware
      --api-key '${VLLM_API_KEY:?set VLLM_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 29000
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    depends_on:
      otel-collector:
        condition: service_started
    ports:
    - ${SMG_BIND:-127.0.0.1}:${SMG_PORT:-30000}:30000
    - 127.0.0.1:${SMG_METRICS_PORT:-29000}:29000
    restart: ${RESTART_POLICY:-unless-stopped}
  jaeger:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: jaeger
    restart: ${RESTART_POLICY:-unless-stopped}
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: ${OTLP_UPSTREAM_ENDPOINT:-jaeger:4317}
      OTLP_UPSTREAM_INSECURE: ${OTLP_UPSTREAM_INSECURE:-true}
      TELEMETRY_RECIPE: gemma4-26b-a4b-tiered-kv
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-development}
    ports:
    - 127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317
    - 127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318
    restart: ${RESTART_POLICY:-unless-stopped}
